name: Trigger Mobile OTA Deploy

on:
  push:
    branches: [main]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger mobile app CI
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.MOBILE_DEPLOY_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/ShaharMeriash/perth-relocation-commander-app/actions/workflows/build-apk.yml/dispatches \
            -d '{"ref":"main"}'
